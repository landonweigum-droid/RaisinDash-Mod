name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          platform: win
      - uses: actions/upload-artifact@v4
        with:
          name: ModOnlyEclipse-win
          path: build/*.geode
